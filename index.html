<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DayFlow — Daily Planner</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== CSS VARIABLES — overridden by themes ===== */
:root {
  --bg:#0e0f14; --surface:#161820; --card:#1e2030; --card2:#252840;
  --border:#2e3150; --accent:#7c6af7; --accent2:#f7a26a; --accent3:#6af7c3;
  --text:#e8eaf6; --text2:#9099c4; --text3:#5a6090;
  --danger:#f76a6a; --success:#6af7a0; --warn:#f7d26a;
  --radius:14px; --radius-sm:8px; --shadow:0 4px 32px rgba(0,0,0,.4);
  --font-display:'DM Serif Display',serif; --font-body:'DM Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden;overflow-y:auto;background:var(--bg);color:var(--text);font-family:var(--font-body);transition:background .25s,color .25s}

/* ===== LAYOUT ===== */
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
#topbar{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;gap:8px;transition:background .25s,border-color .25s}
#main{display:flex;flex:1;overflow:hidden}
#sidebar{width:260px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;transition:background .25s}
#content{flex:1;overflow-y:auto;padding:14px 16px}
#content::-webkit-scrollbar{width:4px}#content::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

/* ===== TOPBAR ===== */
.topbar-brand{font-family:var(--font-display);font-size:1.25rem;color:var(--accent);letter-spacing:.5px;white-space:nowrap}
.topbar-date{font-size:0.75rem;color:var(--text2);white-space:nowrap}
.topbar-actions{display:flex;gap:6px;align-items:center;flex-wrap:nowrap}
.btn-icon{background:var(--card);border:1px solid var(--border);color:var(--text2);border-radius:var(--radius-sm);padding:6px 10px;cursor:pointer;font-size:0.73rem;display:flex;align-items:center;gap:5px;transition:all .2s;white-space:nowrap;font-family:var(--font-body)}
.btn-icon:hover{border-color:var(--accent);color:var(--accent)}
.btn-icon.active{background:var(--accent);color:#fff;border-color:var(--accent)}
#google-status{font-size:0.68rem;padding:4px 8px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text3);white-space:nowrap}
#google-status.connected{border-color:var(--success);color:var(--success)}

/* ===== DAY NAV (prev/next/today) in topbar ===== */
.day-nav-group{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:3px}
.dnav-btn{background:none;border:none;color:var(--text2);cursor:pointer;font-size:0.9rem;padding:3px 8px;border-radius:6px;transition:all .2s;font-family:var(--font-body);line-height:1}
.dnav-btn:hover{background:var(--card2);color:var(--accent)}
.dnav-today{font-size:0.68rem;padding:3px 9px;border-radius:6px;color:var(--text2);cursor:pointer;transition:all .2s;white-space:nowrap;font-weight:600;letter-spacing:.3px}
.dnav-today:hover{background:var(--accent);color:#fff}
.dnav-sep{width:1px;height:14px;background:var(--border);margin:0 2px}

/* ===== THEME PANEL ===== */
#theme-panel{position:fixed;top:50px;right:12px;width:270px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;z-index:150;box-shadow:var(--shadow);display:none;transition:background .25s}
#theme-panel.open{display:block}
.tp-title{font-size:0.8rem;font-weight:700;color:var(--text);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.tp-close{background:none;border:none;color:var(--text3);cursor:pointer;font-size:1rem;line-height:1}
.tp-section{font-size:0.65rem;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin-bottom:7px;margin-top:12px}
.theme-swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.theme-swatch{border-radius:10px;height:44px;cursor:pointer;border:2px solid transparent;transition:all .2s;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;overflow:hidden;position:relative}
.theme-swatch:hover{transform:scale(1.06)}
.theme-swatch.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.swatch-name{font-size:0.55rem;font-weight:700;text-align:center;line-height:1.2;padding:2px 3px;border-radius:4px;background:rgba(0,0,0,.45);color:#fff;position:absolute;bottom:3px;left:2px;right:2px}
/* accent color dots */
.accent-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.accent-dot{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .2s;flex-shrink:0}
.accent-dot:hover{transform:scale(1.15)}
.accent-dot.active{border-color:var(--text);box-shadow:0 0 0 2px var(--text)}

/* ===== SIDEBAR — CALENDAR ===== */
.sidebar-cal{padding:12px}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-month{font-weight:600;font-size:0.83rem;color:var(--text)}
.cal-nav{background:none;border:none;color:var(--text2);cursor:pointer;font-size:1rem;padding:2px 6px;border-radius:4px;transition:color .2s}
.cal-nav:hover{color:var(--accent)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dow{font-size:0.58rem;color:var(--text3);text-align:center;padding:2px 0;font-weight:600;letter-spacing:.5px}
.cal-day{font-size:0.7rem;text-align:center;padding:4px 2px;cursor:pointer;border-radius:6px;color:var(--text2);transition:all .15s;position:relative}
.cal-day:hover{background:var(--card2);color:var(--text)}
.cal-day.today{background:var(--accent);color:#fff;font-weight:700}
.cal-day.selected{background:var(--accent2);color:#111;font-weight:700}
.cal-day.has-tasks::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:4px;height:4px;background:var(--accent3);border-radius:50%}
.cal-day.other-month{opacity:.4}
.sidebar-sep{height:1px;background:var(--border);margin:8px 12px}
.sidebar-stats{padding:12px}
.sidebar-stats h4{font-size:0.68rem;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin-bottom:10px}
.stat-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;font-size:0.76rem}
.stat-label{color:var(--text2)}.stat-val{font-weight:600;color:var(--text)}
.ring-wrap{position:relative;width:38px;height:38px}
.ring-svg{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--card2);stroke-width:4}
.ring-prog{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .5s ease}
.ring-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:0.58rem;font-weight:700;color:var(--text)}
.sidebar-bottom{margin-top:auto;padding:12px;border-top:1px solid var(--border)}
.backup-row{display:flex;gap:5px}
.btn-sm{flex:1;background:var(--card2);border:1px solid var(--border);color:var(--text2);border-radius:var(--radius-sm);padding:7px 6px;cursor:pointer;font-size:0.68rem;text-align:center;transition:all .2s;font-family:var(--font-body)}
.btn-sm:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-sm.primary:hover{opacity:.85}

/* ===== CONTENT AREA ===== */
.day-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px}
.day-title-wrap{flex:1;min-width:0}
.day-title{font-family:var(--font-display);font-size:1.5rem;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day-subtitle{font-size:0.75rem;color:var(--text2);margin-top:1px}
.day-header-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.btn-add{background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);padding:8px 14px;cursor:pointer;font-size:0.78rem;font-family:var(--font-body);font-weight:600;transition:opacity .2s;display:flex;align-items:center;gap:5px;white-space:nowrap}
.btn-add:hover{opacity:.85}

/* Progress */
.progress-section{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:13px 15px;margin-bottom:14px}
.progress-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.progress-label{font-size:0.75rem;color:var(--text2)}
.progress-pct{font-family:var(--font-display);font-size:1.35rem;color:var(--accent)}
.progress-bar-wrap{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin-bottom:8px}
.progress-bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s ease}
.progress-chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{font-size:0.65rem;padding:3px 8px;border-radius:20px;border:1px solid;font-weight:500}
.chip.done{border-color:var(--success);color:var(--success);background:rgba(106,247,160,.08)}
.chip.pending{border-color:var(--warn);color:var(--warn);background:rgba(247,210,106,.08)}
.chip.missed{border-color:var(--danger);color:var(--danger);background:rgba(247,106,106,.08)}

/* Time sections */
.time-section{margin-bottom:12px}
.time-section-header{font-size:0.66rem;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin-bottom:7px;font-weight:600;display:flex;align-items:center;gap:6px}
.time-section-header::after{content:'';flex:1;height:1px;background:var(--border)}

/* Task card */
.task-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:11px 13px;margin-bottom:7px;display:flex;gap:11px;align-items:flex-start;transition:border-color .2s,transform .15s;cursor:default;position:relative;overflow:hidden}
.task-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);border-radius:3px 0 0 3px}
.task-card.done::before{background:var(--success)}
.task-card.missed::before{background:var(--danger)}
.task-card:hover{border-color:var(--accent);transform:translateX(2px)}
.task-check{width:20px;height:20px;border:2px solid var(--border);border-radius:50%;cursor:pointer;flex-shrink:0;margin-top:2px;transition:all .2s;display:flex;align-items:center;justify-content:center}
.task-check:hover{border-color:var(--accent)}
.task-card.done .task-check{background:var(--success);border-color:var(--success)}
.task-check-tick{display:none;color:#111;font-size:0.65rem;font-weight:900}
.task-card.done .task-check-tick{display:block}
.task-body{flex:1;min-width:0}
.task-title{font-size:0.83rem;font-weight:500;color:var(--text);word-break:break-word}
.task-card.done .task-title{text-decoration:line-through;color:var(--text3)}
.task-meta{display:flex;gap:7px;margin-top:4px;flex-wrap:wrap;align-items:center}
.task-time{font-size:0.67rem;color:var(--accent2)}
.task-cat{font-size:0.63rem;padding:2px 6px;border-radius:20px;border:1px solid var(--border);color:var(--text3)}
.task-remark{font-size:0.7rem;color:var(--text2);margin-top:5px;line-height:1.4;border-left:2px solid var(--border);padding-left:6px;font-style:italic}
.task-actions{display:flex;gap:4px;opacity:0;transition:opacity .2s}
.task-card:hover .task-actions{opacity:1}
.task-btn{background:var(--card2);border:1px solid var(--border);color:var(--text3);border-radius:5px;padding:3px 7px;cursor:pointer;font-size:0.67rem;transition:all .2s}
.task-btn:hover{color:var(--accent);border-color:var(--accent)}
.task-btn.del:hover{color:var(--danger);border-color:var(--danger)}

/* Empty */
.empty-day{text-align:center;padding:40px 20px;color:var(--text3)}
.empty-icon{font-size:2.5rem;margin-bottom:10px;opacity:.35}
.empty-text{font-size:0.83rem}

/* ===== MODAL ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;box-shadow:var(--shadow)}
.modal::-webkit-scrollbar{width:3px}.modal::-webkit-scrollbar-thumb{background:var(--border)}
.modal-title{font-family:var(--font-display);font-size:1.15rem;margin-bottom:15px;color:var(--text)}
.form-group{margin-bottom:11px}
.form-label{font-size:0.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-bottom:5px;display:block}
.form-input,.form-select,.form-textarea{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-sm);padding:9px 12px;font-size:0.81rem;font-family:var(--font-body);transition:border-color .2s}
.form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:var(--accent)}
.form-select option{background:var(--card)}
.form-textarea{resize:vertical;min-height:68px;line-height:1.5}
.form-row{display:flex;gap:10px}
.form-row .form-group{flex:1}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:15px}
.btn-cancel{background:var(--card);border:1px solid var(--border);color:var(--text2);border-radius:var(--radius-sm);padding:8px 16px;cursor:pointer;font-size:0.78rem;font-family:var(--font-body)}
.btn-save{background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);padding:8px 18px;cursor:pointer;font-size:0.78rem;font-family:var(--font-body);font-weight:600}
.btn-save:hover{opacity:.85}

/* ===== TOAST ===== */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--card2);border:1px solid var(--border);color:var(--text);padding:9px 18px;border-radius:20px;font-size:0.76rem;z-index:200;transition:transform .3s ease;pointer-events:none;white-space:nowrap}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.success{border-color:var(--success);color:var(--success)}
#toast.error{border-color:var(--danger);color:var(--danger)}

/* ===== MOBILE ===== */
@media(max-width:700px){
  #sidebar{display:none}
  #sidebar.show{display:flex;position:fixed;inset:0;z-index:90;width:100%;overflow-y:auto}
  .topbar-brand{font-size:1rem}
  .day-title{font-size:1.15rem}
  .modal{max-width:100%}
  .topbar-date{display:none}
  #theme-panel{right:6px;width:calc(100vw - 12px)}
}
@media(min-width:701px) and (max-width:1100px){
  #sidebar{width:220px}
}

/* spinner */
.spinner{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

/* Google btn */
#btn-google{display:flex;align-items:center;gap:7px;background:#fff;color:#444;border:1px solid #ddd;border-radius:var(--radius-sm);padding:6px 11px;cursor:pointer;font-size:0.75rem;font-family:var(--font-body);font-weight:500;transition:box-shadow .2s;flex-shrink:0}
#btn-google:hover{box-shadow:0 2px 8px rgba(0,0,0,.3)}
.g-icon{width:13px;height:13px;flex-shrink:0}

/* Summary */
.summary-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.summary-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;text-align:center}
.summary-num{font-family:var(--font-display);font-size:1.9rem;color:var(--accent)}
.summary-desc{font-size:0.7rem;color:var(--text2);margin-top:2px}
.heatmap-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:14px;overflow-x:auto}
.heatmap-title{font-size:0.7rem;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin-bottom:11px}
.heatmap{display:flex;gap:3px}
.heatmap-col{display:flex;flex-direction:column;gap:3px}
.heatmap-cell{width:12px;height:12px;border-radius:2px;background:var(--card2);cursor:pointer;transition:transform .1s}
.heatmap-cell:hover{transform:scale(1.3)}
.heatmap-cell.l1{background:rgba(124,106,247,.2)}
.heatmap-cell.l2{background:rgba(124,106,247,.45)}
.heatmap-cell.l3{background:rgba(124,106,247,.7)}
.heatmap-cell.l4{background:var(--accent)}
.view-tabs{display:flex;gap:6px;margin-bottom:14px}
.view-tab{padding:5px 13px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text2);font-size:0.73rem;cursor:pointer;transition:all .2s}
.view-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.setup-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:15px;margin-bottom:14px}
.setup-box h3{font-size:0.83rem;color:var(--accent2);margin-bottom:8px}
.setup-box p,.setup-box li{font-size:0.73rem;color:var(--text2);line-height:1.6}
.setup-box ol{padding-left:14px}
.setup-box code{background:var(--card2);border-radius:3px;padding:1px 5px;color:var(--accent);font-size:0.68rem}

@media (max-width:700px){
  #topbar{flex-wrap:wrap;padding:10px;gap:10px}
  .day-nav-group{order:3;width:100%;justify-content:center}
  .topbar-actions{margin-left:auto}
  .task-card{padding:14px}
  .task-actions{opacity:1}
  .task-btn{min-width:36px;min-height:36px}
}
.dnav-btn{min-width:44px;min-height:44px;padding:10px}
.dnav-today{min-height:44px;display:flex;align-items:center;justify-content:center;padding:0 14px}
@media(min-width:701px) and (max-width:1100px){
  #sidebar{width:280px}
  #content{padding:20px}
}
@media(min-width:1400px){
  #content{max-width:1400px;margin:auto;width:100%;padding:24px}
}

</style>
</head>
<body>
<div id="app">
  <!-- TOP BAR -->
  <div id="topbar">
    <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
      <button class="btn-icon" id="btn-sidebar-toggle" title="Toggle sidebar">☰</button>
      <div class="topbar-brand">DayFlow</div>
    </div>

    <!-- PREV / TODAY / NEXT day navigation -->
    <div class="day-nav-group">
      <button class="dnav-btn" onclick="navigateDay(-1)" title="Previous day">◀</button>
      <div class="dnav-sep"></div>
      <button class="dnav-today" onclick="goToday()" id="dnav-today-btn">Today</button>
      <div class="dnav-sep"></div>
      <button class="dnav-btn" onclick="navigateDay(1)" title="Next day">▶</button>
    </div>

    <div id="topbar-date" class="topbar-date"></div>

    <div class="topbar-actions">
      <button class="btn-icon" onclick="toggleThemePanel()" id="btn-theme" title="Change theme">🎨 Theme</button>
      <span id="google-status">Not signed in</span>
      <button id="btn-google" onclick="handleGoogleAuth()">
        <svg class="g-icon" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.08 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-3.58-13.45-8.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/><path fill="none" d="M0 0h48v48H0z"/></svg>
        Sign in
      </button>
    </div>
  </div>

  <!-- THEME PANEL -->
  <div id="theme-panel">
    <div class="tp-title">
      🎨 Theme &amp; Colors
      <button class="tp-close" onclick="toggleThemePanel()">✕</button>
    </div>
    <div class="tp-section">Base Theme</div>
    <div class="theme-swatches" id="theme-swatches"></div>
    <div class="tp-section">Accent Color</div>
    <div class="accent-grid" id="accent-grid"></div>
  </div>

  <!-- MAIN -->
  <div id="main">
    <!-- SIDEBAR -->
    <div id="sidebar">
      <div class="sidebar-cal">
        <div class="cal-header">
          <button class="cal-nav" onclick="calNav(-1)">‹</button>
          <span class="cal-month" id="cal-month-label"></span>
          <button class="cal-nav" onclick="calNav(1)">›</button>
        </div>
        <div class="cal-grid" id="cal-dow"></div>
        <div class="cal-grid" id="cal-grid"></div>
      </div>

function applyTheme(themeId, accentId) {
  currentThemeId  = themeId  || currentThemeId;
  currentAccentId = accentId || currentAccentId;
  const t = BASE_THEMES.find(x=>x.id===currentThemeId) || BASE_THEMES[0];
  const a = ACCENT_COLORS.find(x=>x.id===currentAccentId) || ACCENT_COLORS[0];
  const r = document.documentElement.style;
  r.setProperty('--bg',      t.bg);
  r.setProperty('--surface', t.surface);
  r.setProperty('--card',    t.card);
  r.setProperty('--card2',   t.card2);
  r.setProperty('--border',  t.border);
  r.setProperty('--text',    t.text);
  r.setProperty('--text2',   t.text2);
  r.setProperty('--text3',   t.text3);
  r.setProperty('--accent',  a.val);
  // update heatmap cells to match accent
  const style = document.getElementById('heatmap-dyn') || (() => {
    const s=document.createElement('style'); s.id='heatmap-dyn'; document.head.appendChild(s); return s;
  })();
  const rgb = hexToRgb(a.val);
  style.textContent = `
    .heatmap-cell.l1{background:rgba(${rgb},.18)}
    .heatmap-cell.l2{background:rgba(${rgb},.4)}
    .heatmap-cell.l3{background:rgba(${rgb},.68)}
    .heatmap-cell.l4{background:${a.val}}
  `;
  localStorage.setItem('dayflow_theme', JSON.stringify({themeId:currentThemeId, accentId:currentAccentId}));
  renderThemePanel();
}
function hexToRgb(hex) {
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `${r},${g},${b}`;
}

function renderThemePanel() {
  // Base theme swatches
  const sw = document.getElementById('theme-swatches');

         style="background:linear-gradient(135deg,${t.bg} 40%,${t.surface} 100%);border-color:${t.id===currentThemeId?'var(--accent)':'transparent'}"
         onclick="applyTheme('${t.id}',null)" title="${t.name}">
      <span class="swatch-name">${t.name}</span>
    </div>`).join('');

  const ag = document.getElementById('accent-grid');

}

// ===== STATE =====
let data         = {};
let selectedDate = todayStr();
let calViewDate  = new Date();
let googleUser   = null;
let gisClient    = null;
let currentView  = 'day';
let editingTask  = null;

// ===== HELPERS =====
function todayStr() { return fmtDate(new Date()); }
function fmtDate(d) {
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}
function parseDate(s) { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function uid()    { return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function dayName(d) { return ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d.getDay()]; }
function monthName(d) { return d.toLocaleString('default',{month:'long',year:'numeric'}); }
function shortMonth(d) { return d.toLocaleString('default',{month:'short'}); }
function addDays(dateStr, n) {
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  dt.setDate(dt.getDate() + n);
  return fmtDate(dt);
}

// ===== DAY NAVIGATION =====
function navigateDay(dir) {
  selectedDate = addDays(selectedDate, dir);
  // Sync calendar view if we cross a month boundary
  const sd = parseDate(selectedDate);
  if (sd.getFullYear() !== calViewDate.getFullYear() || sd.getMonth() !== calViewDate.getMonth()) {
    calViewDate = new Date(sd.getFullYear(), sd.getMonth(), 1);
  }
  renderAll();
  // Scroll content to top
  document.getElementById('content').scrollTop = 0;
}
function goToday() {
  selectedDate = todayStr();
  const today  = new Date();
  calViewDate  = new Date(today.getFullYear(), today.getMonth(), 1);
  renderAll();
  document.getElementById('content').scrollTop = 0;
}

// ===== DATA =====
function loadData() {
  try { const s=localStorage.getItem('dayflow_data'); if(s) data=JSON.parse(s); } catch(e){}
  try {
    const th=JSON.parse(localStorage.getItem('dayflow_theme')||'{}');
    if(th.themeId||th.accentId) { currentThemeId=th.themeId||'dark'; currentAccentId=th.accentId||'violet'; }
  } catch(e){}
}
function saveData() {
  try { localStorage.setItem('dayflow_data', JSON.stringify(data)); } catch(e){}
  renderAll();
}

let toastTimer;

// ===== GOOGLE AUTH =====
function initGoogleAuth() {
  if (typeof google==='undefined'||!google.accounts) { setTimeout(initGoogleAuth,500); return; }
  if (!GOOGLE_CLIENT_ID||GOOGLE_CLIENT_ID.includes('YOUR_')) return;
  gisClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID, scope: SCOPES,
    callback: (tokenResp) => {
      if (tokenResp.access_token) {
        googleUser={token:tokenResp.access_token};
        document.getElementById('google-status').textContent='● Connected';
        document.getElementById('google-status').className='connected';
        document.getElementById('btn-google').style.display='none';
        toast('Google Drive connected ✓','success');
      }
    }
  });
}
function handleGoogleAuth() {
  if (!GOOGLE_CLIENT_ID||GOOGLE_CLIENT_ID.includes('YOUR_')) { toast('⚠ Set your Google Client ID first','error'); return; }
  if (!gisClient) { toast('Google API not ready','error'); return; }
  gisClient.requestAccessToken();
}

// ===== GOOGLE DRIVE BACKUP =====
async function backupToDrive() {
  if (!googleUser) { toast('Sign in with Google first','error'); return; }
  const bs=document.getElementById('backup-status');
  bs.innerHTML='<span class="spinner"></span> Backing up...';
  try {
    const listRes=await fetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name='${BACKUP_FILENAME}'`,{headers:{Authorization:`Bearer ${googleUser.token}`}});
    const listJson=await listRes.json();
    let fileId=listJson.files&&listJson.files[0]?listJson.files[0].id:null;
    const form=new FormData();
    form.append('metadata',new Blob([JSON.stringify({name:BACKUP_FILENAME,...(fileId?{}:{parents:['appDataFolder']})})],{type:'application/json'}));
    form.append('file',new Blob([JSON.stringify(data)],{type:'application/json'}));
    const res=await fetch(fileId?`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=multipart`:'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',
      {method:fileId?'PATCH':'POST',headers:{Authorization:`Bearer ${googleUser.token}`},body:form});
    if(res.ok){bs.textContent='✓ Backed up '+new Date().toLocaleTimeString();toast('Backup saved ✓','success');}
    else throw new Error('Upload failed');
  } catch(e){bs.textContent='✗ Failed';toast('Backup failed','error');}
}
async function restoreFromDrive() {
  if (!googleUser) { toast('Sign in with Google first','error'); return; }
  const bs=document.getElementById('backup-status');
  bs.innerHTML='<span class="spinner"></span> Restoring...';
  try {
    const listRes=await fetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name='${BACKUP_FILENAME}'`,{headers:{Authorization:`Bearer ${googleUser.token}`}});
    const listJson=await listRes.json();
    const fileId=listJson.files&&listJson.files[0]?listJson.files[0].id:null;
    if(!fileId){toast('No backup found','error');bs.textContent='';return;}
    const dlRes=await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`,{headers:{Authorization:`Bearer ${googleUser.token}`}});
    data=await dlRes.json(); saveData();
    bs.textContent='✓ Restored'; toast('Restored from Drive ✓','success');
  } catch(e){bs.textContent='✗ Failed';toast('Restore failed','error');}
}
function exportJSON() {
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
  a.download=`dayflow_${todayStr()}.json`; a.click();
  toast('Exported ✓');
}

// ===== TASKS =====
function openAddModal() {
  editingTask=null;
  document.getElementById('modal-title').textContent='Add Task — '+selectedDate;
  ['f-title','f-start','f-end','f-remark'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f-cat').value='General';
  document.getElementById('f-priority').value='normal';
  document.getElementById('modal').style.display='flex';
  setTimeout(()=>document.getElementById('f-title').focus(),100);
}
function openEditModal(dateStr,idx) {
  const task=(data[dateStr]||[])[idx]; if(!task) return;
  editingTask={date:dateStr,idx};
  document.getElementById('modal-title').textContent='Edit Task';
  document.getElementById('f-title').value=task.title;
  document.getElementById('f-start').value=task.start||'';
  document.getElementById('f-end').value=task.end||'';
  document.getElementById('f-cat').value=task.cat||'General';
  document.getElementById('f-priority').value=task.priority||'normal';
  document.getElementById('f-remark').value=task.remark||'';
  document.getElementById('modal').style.display='flex';
  setTimeout(()=>document.getElementById('f-title').focus(),100);
}
function closeModal(){ document.getElementById('modal').style.display='none'; editingTask=null; }
function closeModalOnOverlay(e){ if(e.target.id==='modal') closeModal(); }

function saveTask() {
  const title=document.getElementById('f-title').value.trim();
  if(!title){document.getElementById('f-title').focus();return;}
  const task={
    id: editingTask?(data[editingTask.date][editingTask.idx].id||uid()):uid(),
    title, start:document.getElementById('f-start').value, end:document.getElementById('f-end').value,
    cat:document.getElementById('f-cat').value, priority:document.getElementById('f-priority').value,
    remark:document.getElementById('f-remark').value.trim(),
    done: editingTask?data[editingTask.date][editingTask.idx].done:false,
    createdAt: editingTask?data[editingTask.date][editingTask.idx].createdAt:Date.now()
  };
  if(editingTask){ data[editingTask.date][editingTask.idx]=task; }
  else { if(!data[selectedDate])data[selectedDate]=[]; data[selectedDate].push(task); }
  saveData(); closeModal(); toast(editingTask?'Task updated ✓':'Task added ✓','success');
}
function toggleDone(dateStr,idx){
  if(!data[dateStr]||!data[dateStr][idx]) return;
  data[dateStr][idx].done=!data[dateStr][idx].done; saveData();
}
function deleteTask(dateStr,idx){
  if(!data[dateStr]) return;
  data[dateStr].splice(idx,1); saveData(); toast('Task deleted');
}

// ===== CALENDAR =====
function calNav(dir){ calViewDate=new Date(calViewDate.getFullYear(),calViewDate.getMonth()+dir,1); renderCalendar(); }
function renderCalendar() {
  document.getElementById('cal-month-label').textContent=monthName(calViewDate);
  document.getElementById('cal-dow').innerHTML=['Su','Mo','Tu','We','Th','Fr','Sa'].map(d=>`<div class="cal-dow">${d}</div>`).join('');
  const y=calViewDate.getFullYear(),m=calViewDate.getMonth();
  const first=new Date(y,m,1).getDay(), days=new Date(y,m+1,0).getDate(), today=todayStr();
  let html='';
  for(let i=0;i<first;i++){const pv=new Date(y,m,-first+1+i),ds=fmtDate(pv);html+=`<div class="cal-day other-month${ds===selectedDate?' selected':''}" onclick="selectDate('${ds}')">${pv.getDate()}</div>`;}
  for(let d=1;d<=days;d++){
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const hasTasks=(data[ds]||[]).length>0;
    const cls=['cal-day',ds===today?'today':'',ds===selectedDate?'selected':'',hasTasks?'has-tasks':''].filter(Boolean).join(' ');
    html+=`<div class="${cls}" onclick="selectDate('${ds}')">${d}</div>`;
  }
  document.getElementById('cal-grid').innerHTML=html;
}

function selectDate(ds){
  selectedDate=ds;
  const sd=parseDate(ds);
  if(sd.getFullYear()!==calViewDate.getFullYear()||sd.getMonth()!==calViewDate.getMonth())
    calViewDate=new Date(sd.getFullYear(),sd.getMonth(),1);
  renderCalendar(); renderDayView(); renderSidebarStats();
  if(window.innerWidth<=700) document.getElementById('sidebar').classList.remove('show');
}

// ===== RENDER =====
function renderAll(){ renderCalendar(); renderDayView(); renderSidebarStats(); if(currentView==='summary') renderSummaryView(); }

function renderSidebarStats(){
  const today=todayStr(), tasks=data[today]||[], done=tasks.filter(t=>t.done).length, total=tasks.length;
  const pct=total?Math.round(done/total*100):0;
  document.getElementById('sidebar-ring').style.strokeDashoffset=94.2-(pct/100)*94.2;
  document.getElementById('sidebar-ring-pct').textContent=pct+'%';
  document.getElementById('sidebar-done-count').textContent=`${done}/${total} done`;
  const now=new Date(), dow=now.getDay(); let wD=0,wT=0;
  for(let i=0;i<7;i++){const d=new Date(now);d.setDate(now.getDate()-dow+i);const ts=data[fmtDate(d)]||[];wT+=ts.length;wD+=ts.filter(t=>t.done).length;}
  document.getElementById('stat-week').textContent=wT?`${Math.round(wD/wT*100)}%`:'—';
  const ym=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  let mD=0,mT=0; Object.keys(data).filter(k=>k.startsWith(ym)).forEach(k=>{const ts=data[k]||[];mT+=ts.length;mD+=ts.filter(t=>t.done).length;});
  document.getElementById('stat-month').textContent=mT?`${Math.round(mD/mT*100)}%`:'—';
  let tot=0; Object.values(data).forEach(t=>{tot+=t.length;}); document.getElementById('stat-total').textContent=tot;
}

function renderDayView(){
  const wrap=document.getElementById('view-day');
  const tasks=data[selectedDate]||[];
  const d=parseDate(selectedDate), today=todayStr();
  const done=tasks.filter(t=>t.done).length, total=tasks.length;
  const missed=tasks.filter(t=>!t.done&&selectedDate<today).length;
  const pending=total-done-(selectedDate<today?missed:0);
  const pct=total?Math.round(done/total*100):0;

  // Sort by start time for display
  const indexed=(data[selectedDate]||[]).map((t,i)=>({task:t,origIdx:i}));

  // Group by period
  const groups={Morning:[],Afternoon:[],Evening:[],Night:[],Anytime:[]};
  indexed.forEach(({task,origIdx})=>{
    const h=task.start?parseInt(task.start.split(':')[0]):-1;
    let g='Anytime';
    if(h>=5&&h<12)g='Morning'; else if(h>=12&&h<17)g='Afternoon';
    else if(h>=17&&h<21)g='Evening'; else if(h>=21||h===0)g='Night';
    groups[g].push({task,origIdx});
  });

  let html=`
  <div class="day-header">
    <div class="day-title-wrap">
      <div class="day-title">${dayName(d)}, ${d.getDate()} ${shortMonth(d)} ${d.getFullYear()}</div>
      <div class="day-subtitle">${selectedDate===today?'— Today':selectedDate}</div>
    </div>
    <div class="day-header-right">
      <button class="btn-add" onclick="openAddModal()">＋ Add Task</button>
    </div>
  </div>
  <div class="progress-section">
    <div class="progress-top"><span class="progress-label">Day Progress</span><span class="progress-pct">${pct}%</span></div>
    <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
    <div class="progress-chips">
      <span class="chip done">✓ ${done} done</span>
      ${pending>0?`<span class="chip pending">⏳ ${pending} pending</span>`:''}
      ${missed>0?`<span class="chip missed">✗ ${missed} missed</span>`:''}
      ${total===0?'<span class="chip pending">No tasks yet</span>':''}
    </div>
  </div>`;

  const order=['Morning','Afternoon','Evening','Night','Anytime'];
  const icons={Morning:'🌅',Afternoon:'☀️',Evening:'🌆',Night:'🌙',Anytime:'📌'};
  let hasAny=false;
  order.forEach(grp=>{
    const items=groups[grp]; if(!items.length) return; hasAny=true;
    html+=`<div class="time-section"><div class="time-section-header">${icons[grp]} ${grp}</div>`;
    items.forEach(({task,origIdx:i})=>{
      const isMissed=!task.done&&selectedDate<today;
      const cls=`task-card${task.done?' done':''}${isMissed?' missed':''}`;
      const pd=task.priority==='high'?'🔴 ':task.priority==='low'?'🔵 ':'';
      html+=`<div class="${cls}">
        <div class="task-check" onclick="toggleDone('${selectedDate}',${i})"><span class="task-check-tick">✓</span></div>
        <div class="task-body">
          <div class="task-title">${pd}${escHtml(task.title)}</div>
          <div class="task-meta">
            ${task.start?`<span class="task-time">🕐 ${task.start}${task.end?' – '+task.end:''}</span>`:''}
            <span class="task-cat">${escHtml(task.cat||'General')}</span>
          </div>
          ${task.remark?`<div class="task-remark">${escHtml(task.remark)}</div>`:''}
        </div>
        <div class="task-actions">
          <button class="task-btn" onclick="openEditModal('${selectedDate}',${i})">✎</button>
          <button class="task-btn del" onclick="deleteTask('${selectedDate}',${i})">✕</button>
        </div>
      </div>`;
    });
    html+='</div>';
  });

  if(!hasAny) html+=`<div class="empty-day"><div class="empty-icon">📋</div><div class="empty-text">No tasks for this day.<br>Tap <b>+ Add Task</b> to begin.</div></div>`;
  wrap.innerHTML=html;
}

function renderSummaryView(){
  const wrap=document.getElementById('view-summary');
  const today=new Date();
  let totalTasks=0,doneTasks=0,activeDays=0;
  Object.keys(data).forEach(k=>{const ts=data[k]||[];if(ts.length){activeDays++;totalTasks+=ts.length;doneTasks+=ts.filter(t=>t.done).length;}});
  const avgPct=activeDays?Math.round(doneTasks/totalTasks*100):0;
  const weeksBack=26;
  const startDay=new Date(today); startDay.setDate(today.getDate()-today.getDay()-(weeksBack-1)*7);
  let heatCols='';
  for(let w=0;w<weeksBack;w++){
    heatCols+='<div class="heatmap-col">';
    for(let d=0;d<7;d++){
      const cur=new Date(startDay); cur.setDate(startDay.getDate()+w*7+d);
      const ds=fmtDate(cur), ts=data[ds]||[];
      const pct=ts.length?ts.filter(t=>t.done).length/ts.length:0;
      let lvl=0; if(ts.length){if(pct>=.75)lvl=4;else if(pct>=.5)lvl=3;else if(pct>=.25)lvl=2;else lvl=1;}
      heatCols+=`<div class="heatmap-cell${lvl?` l${lvl}`:''}" title="${ds}: ${ts.filter(t=>t.done).length}/${ts.length} done" onclick="selectDate('${ds}');setView('day',null)"></div>`;
    }
    heatCols+='</div>';
  }
  wrap.innerHTML=`
  <div class="summary-grid">
    <div class="summary-card"><div class="summary-num">${totalTasks}</div><div class="summary-desc">Total Tasks</div></div>
    <div class="summary-card"><div class="summary-num">${doneTasks}</div><div class="summary-desc">Completed</div></div>
    <div class="summary-card"><div class="summary-num">${activeDays}</div><div class="summary-desc">Active Days</div></div>
    <div class="summary-card"><div class="summary-num" style="color:var(--accent2)">${avgPct}%</div><div class="summary-desc">Avg Completion</div></div>
  </div>
  <div class="heatmap-wrap">
    <div class="heatmap-title">Activity Heatmap — last 6 months</div>
    <div style="display:flex;gap:6px;align-items:flex-start">
      <div style="display:flex;flex-direction:column;gap:3px;margin-right:4px;padding-top:2px">
        ${['Su','Mo','Tu','We','Th','Fr','Sa'].map((d,i)=>i%2===0?`<div style="font-size:.55rem;color:var(--text3);height:12px;line-height:12px">${d}</div>`:`<div style="height:12px"></div>`).join('')}
      </div>
      <div class="heatmap" style="flex-wrap:nowrap;overflow-x:auto">${heatCols}</div>
    </div>
    <div style="display:flex;align-items:center;gap:6px;margin-top:10px;font-size:.63rem;color:var(--text3)">
      Less <div class="heatmap-cell"></div><div class="heatmap-cell l1"></div><div class="heatmap-cell l2"></div><div class="heatmap-cell l3"></div><div class="heatmap-cell l4"></div> More
    </div>
  </div>`;
}

function setView(v,el){
  currentView=v;
  document.querySelectorAll('.view-tab').forEach(t=>t.classList.remove('active'));
  if(el) el.classList.add('active');
  else document.querySelectorAll('.view-tab').forEach(t=>{if(t.textContent.toLowerCase()===v)t.classList.add('active');});
  document.getElementById('view-day').style.display=v==='day'?'':'none';
  document.getElementById('view-summary').style.display=v==='summary'?'':'none';
  if(v==='summary') renderSummaryView();
}

function escHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

document.getElementById('btn-sidebar-toggle').addEventListener('click',()=>{ document.getElementById('sidebar').classList.toggle('show'); });

function updateTopbarDate(){
  const now=new Date();
  document.getElementById('topbar-date').textContent=now.toLocaleDateString('en-BD',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}

// keyboard shortcuts
document.addEventListener('keydown', e => {
  if (document.getElementById('modal').style.display==='flex') return;
  if (e.key==='ArrowLeft')  navigateDay(-1);
  if (e.key==='ArrowRight') navigateDay(1);
  if (e.key==='t'||e.key==='T') goToday();
});

// ===== INIT =====
window.addEventListener('load',()=>{
  loadData();
  applyTheme(currentThemeId, currentAccentId);
  renderThemePanel();
  updateTopbarDate();
  setInterval(updateTopbarDate, 60000);
  renderAll();
  initGoogleAuth();
});
</script>
</body>
</html>
